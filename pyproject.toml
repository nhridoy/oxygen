[project]
name = "oxygen"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14.7"
dependencies = [
    "authlib>=1.8.0",
    "boto3>=1.43.89",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "deepl>=1.32.0",
    "dj-rest-auth>=7.2.0",
    "django>=6.1.1",
    "django-annoying>=0.10.8",
    "django-autoslug>=1.9.9",
    "django-cleanup>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=8.0.0",
    "django-filter>=26.1",
    "django-modeltranslation>=0.20.4",
    "django-redis>=7.0.0",
    "django-storages>=1.14.6",
    "django-tinymce>=5.0.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "environs>=15.2.0",
    "fcm-django>=3.2.0",
    "fernet>=1.0.1",
    "mailchecker>=6.0.21",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pyotp>=2.10.0",
    "requests>=2.34.2",
    "social-auth-app-django>=6.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
testpaths = [
    "article",
    "authentications",
    "chat",
    "forum",
    "options",
    "payment",
    "site_settings",
    "support",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]
pythonVersion = "3.14.7"
venvPath = "."
venv = ".venv"
